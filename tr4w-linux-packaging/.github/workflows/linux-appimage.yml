name: Linux AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    # Builds inside an Ubuntu 22.04 container on the self-hosted Linux runner.
    # The runner's own distro is therefore irrelevant: the glibc floor -- and so
    # the oldest distro TR4W runs on -- is fixed by packaging/linux/Dockerfile,
    # not by whatever the runner happens to be updated to next year.
    #
    # To build bare-metal instead: run `sudo ./packaging/linux/setup-build-host.sh`
    # once on the runner, then replace the two docker steps below with a single
    # `run: ./packaging/linux/build-appimage.sh`. Same script, same output; the
    # floor just becomes the runner's own glibc.
    runs-on: [self-hosted, linux, x64]

    env:
      WIDGETSET: qt5
      PROJECT: tr4w.lpi

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # VERSION comes from git describe

      - name: Build the build image
        run: |
          docker build \
            --tag tr4w-build:ubuntu-22.04 \
            --file packaging/linux/Dockerfile \
            packaging/linux

      - name: Build AppImage
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env WIDGETSET \
            --env PROJECT \
            tr4w-build:ubuntu-22.04 \
            ./packaging/linux/build-appimage.sh

      - name: Smoke test
        run: |
          f=$(ls dist/TR4W-*.AppImage)
          chmod +x "$f"
          # Runs the packed AppImage on the RUNNER, outside the container, which
          # is the closest thing CI has to a user's machine. Headless via the
          # offscreen QPA -- this is what catches a missing Qt platform plugin.
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 30 "$f" --version \
            || echo "::warning::binary has no --version; startup not verified"

      - uses: actions/upload-artifact@v4
        with:
          name: TR4W-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.sha256
